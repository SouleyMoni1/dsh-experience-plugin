# dsh-experience-plugin bundle patch —— 挂载到 profile 的插件行。
#
# 发布后安装：
#   dsh plugin --profile web add dsh-experience-plugin
#
# 本地开发安装（link 方式，路径换成你的项目目录）：
#   dsh plugin --profile web add link:<本项目绝对路径>
#
# 卸载：
#   dsh plugin --profile web remove dsh-experience-plugin
#
# 这一行同时挂载两个半区：
#   - host 半区：src/index.ts（model-reasoning 注入 + RPC 通道），经包名解析
#   - client 半区：src/client/index.ts（设置页 UI），经 package.json 的 dsh.client 声明发现
- insert:
    - id: hello
      name: 'dsh-experience-plugin'